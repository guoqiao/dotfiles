# Use vim keybindings in copy mode
setw -g mode-keys vi

# prefix + hjkl to move around
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r ^k resizep -U 10
bind -r ^j resizep -D 10
bind -r ^h resizep -L 10
bind -r ^l resizep -R 10

# set Zsh as your default Tmux shell
set-option -g default-shell /bin/zsh

# UTF-8 is always enabled in modern tmux.

# Enable extended key reporting so modified Enter keys work in modern terminals.
set -g extended-keys on
set -g extended-keys-format csi-u

# Tmux should be pretty, we need 256 color for that
set -g default-terminal "screen-256color"


# Tmux uses a 'control key', let's set it to 'Ctrl-a'
# Reason: 'Ctrl-a' is easier to reach than 'Ctrl-b'
# set -g prefix C-a
# unbind C-b

# command delay? We don't want that, make it short
set -sg escape-time 1

# Set the numbering of windows to go from 1 instead
# of 0 - silly programmers :|
set-option -g base-index 1
setw -g pane-base-index 1


# Allow us to reload our Tmux configuration while
# using Tmux
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Getting interesting now, we use the vertical and horizontal
# symbols to split the screen
bind | split-window -h
bind - split-window -v

# start selecting text typing 'v' key (once you are in copy mode)
bind-key -T copy-mode-vi v send -X begin-selection
# copy selected text to the system's clipboard
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# tmux-palette: command palette for tmux
# Installed by `make tmux` into ~/.config/tmux-palette.
bind -n C-p run-shell "$HOME/.config/tmux-palette/bin/tmux-palette.sh"
